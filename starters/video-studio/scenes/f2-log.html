<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Act II · The morning after</title>
<link rel="stylesheet" href="../lib/stage.css">
<link rel="stylesheet" href="../lib/cinema.css">
<script src="../lib/brand.js"></script>
<script src="../lib/studio.js"></script>
<script src="../lib/cinema.js"></script>
<style>
  .wrap { width: 70%; display: flex; flex-direction: column; gap: 2.4vmin; z-index: 10; }
  .log { display: flex; flex-direction: column; gap: .9vmin; }
  .call {
    display: flex; align-items: center; gap: 2vmin;
    font-family: var(--brand-font-mono); font-size: 2.05vmin; letter-spacing: .06em;
    padding: .9vmin 0;
    border-bottom: 1px solid rgba(0,0,0,.07);
  }
  .call .missed { color: #c0392b; font-weight: 500; width: 11vmin; }
  .call .num { flex: 1; opacity: .75; }
  .call .dur { opacity: .45; }
  .tally { display: flex; align-items: baseline; gap: 2.4vmin; margin-top: 1.5vmin; }
  .tally .n { font-size: 13vmin; font-weight: 800; letter-spacing: -.05em; line-height: 1;
              font-variant-numeric: tabular-nums; color: var(--brand-accent); }
  .tally .cap { font-size: var(--t-h2); font-weight: 600; letter-spacing: -.02em; }
</style>
</head>
<body>
  <div class="stage light">
    <div class="bg-grid a-fade" style="--dur:1.4s"></div>
    <div class="grain" id="grain" style="--grain:.09"></div>

    <div class="wrap">
      <div class="kicker a-rise" style="--delay:.15s">07:04 · THE MORNING AFTER</div>
      <div class="log" id="log"></div>
      <div class="tally">
        <div class="n" id="n">0</div>
        <div class="cap a-rise" style="--delay:2.4s">calls nobody saw.</div>
      </div>
    </div>

    <div class="bars static"></div>
  </div>

<script>
const CALLS = [
  ["22:10", "+1 512 ···· 4418", "0:22"],
  ["22:48", "+1 480 ···· 9037", "0:14"],
  ["23:11", "+1 214 ···· 7752", "0:31"],
  ["23:47", "+1 602 ···· 1180", "0:18"],
  ["00:26", "+1 915 ···· 6604", "0:09"],
  ["01:32", "+1 806 ···· 2237", "0:25"],
];

window.__sceneReady = (async () => {
  await window.__brandReady;
  window.__cinema.grain(document.getElementById("grain"));

  const host = document.getElementById("log");
  CALLS.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "call a-slide";
    row.style.setProperty("--delay", (0.45 + i * 0.17) + "s");
    row.style.setProperty("--dur", ".6s");
    row.innerHTML = `<span class="missed">MISSED</span><span class="num"></span><span class="dur"></span>`;
    row.querySelector(".num").textContent = `${c[0]}   ${c[1]}`;
    row.querySelector(".dur").textContent = c[2];
    // The 23:47 call is the one we just watched ring out.
    if (c[0] === "23:47") row.style.fontWeight = "700";
    host.appendChild(row);
  });

  const n = document.getElementById("n");
  window.__studio.onSeek((t) => {
    n.textContent = Math.round(window.__studio.tween(t, { from: 0, to: 9, delay: 1900, dur: 1500, ease: "outExpo" }));
  });
})();
</script>
</body>
</html>
