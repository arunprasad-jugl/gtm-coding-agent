<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Act III · The same night</title>
<link rel="stylesheet" href="../lib/stage.css">
<link rel="stylesheet" href="../lib/cinema.css">
<script src="../lib/brand.js"></script>
<script src="../lib/studio.js"></script>
<script src="../lib/cinema.js"></script>
<script src="../lib/lobby.js"></script>
<script src="../lib/logo.js"></script>
<style>
  .stage { padding: 0; }
  /* Same frame as Act I, so the only thing that changed is the outcome. */
  .scrim { position: absolute; inset: 0; z-index: 12; background: rgba(4,3,2,.52); opacity: 0; }
  .panel {
    position: absolute; z-index: 20; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin; padding: 0 10vmin;
  }
  .mark { width: 9vmin; height: 7.4vmin; opacity: 0;
          filter: drop-shadow(0 0 3.5vmin color-mix(in srgb, var(--brand-accent) 60%, transparent)); }
  .slug {
    position: absolute; z-index: 58; left: 50%; top: 13%; translate: -50% 0;
    font-family: var(--brand-font-mono); font-size: 1.85vmin; letter-spacing: .26em;
    color: var(--brand-accent); opacity: 0;
  }
  .receipt { opacity: 0; }
</style>
</head>
<body>
  <div class="stage">
    <div class="env" id="env"></div>
    <div class="scrim" id="scrim"></div>
    <div class="grain" id="grain"></div>

    <div class="slug" id="slug">THE SAME NIGHT</div>
    <div class="timecode"><span class="rec"></span><span id="tc"></span></div>

    <div class="panel">
      <div class="mark" id="mark" data-logo></div>
      <div class="transcript" id="script"></div>
      <div class="receipt" id="receipt">
        <div class="r-head">Written to your PMS</div>
        <div class="r-row"><span class="k">Guest</span><span class="v">M. Alvarez</span></div>
        <div class="r-row"><span class="k">Stay</span><span class="v">21 nights</span></div>
        <div class="r-row"><span class="k">Rate</span><span class="v">$119 / night</span></div>
        <div class="r-row"><span class="k">Room</span><span class="v">412 · held</span></div>
        <div class="r-row"><span class="k">Call</span><span class="v">00:19</span></div>
      </div>
    </div>

    <div class="bars static"></div>
  </div>

<script>
const LINES = [
  ["guest", "Do you have anything for about three weeks?", 5600, 2300],
  ["bell",  "We do — a king studio, twenty-one nights, one nineteen a night.", 8400, 3200],
  ["guest", "That works. Can you hold it?", 12200, 1700],
  ["bell",  "It's held. Confirmation's on its way to you now.", 14400, 2600],
];

window.__sceneReady = (async () => {
  await window.__logoReady;
  const D = window.__sceneDuration || 24000;

  // Identical construction to Act I — same component, same defaults.
  window.__lobby(document.getElementById("env"));
  window.__cinema.camera(D);
  window.__cinema.grain(document.getElementById("grain"));
  window.__cinema.timecode(document.getElementById("tc"), "23:47:02");
  window.__cinema.window(document.getElementById("slug"), 300, 3400);

  const phone = document.querySelector(".phone");
  const scrim = document.getElementById("scrim");
  const mark = document.getElementById("mark");
  const receipt = document.getElementById("receipt");

  const host = document.getElementById("script");
  for (const [who, said, from, dur] of LINES) {
    const row = document.createElement("div");
    row.className = "utt " + who;
    row.style.opacity = "0";
    row.innerHTML = `<div class="who">${who === "bell" ? "HotelBell" : "Guest"}</div><div class="said"></div>`;
    host.appendChild(row);
    window.__cinema.type(row.querySelector(".said"), said, { from, dur });
    window.__cinema.window(row, from - 250);
  }

  window.__studio.onSeek((t) => {
    // One ring, then it's answered — the whole difference between the acts.
    phone.classList.toggle("lit", t >= 1400 && t < 2900);
    // Pull the room back so the conversation can come forward.
    scrim.style.opacity = String(window.__studio.tween(t, { from: 0, to: 1, delay: 3000, dur: 1400, ease: "outCubic" }));
    mark.style.opacity = String(window.__studio.tween(t, { from: 0, to: 1, delay: 3100, dur: 900, ease: "outCubic" }));
    receipt.style.opacity = String(window.__studio.tween(t, { from: 0, to: 1, delay: 18200, dur: 700, ease: "outCubic" }));
  });
})();
</script>
</body>
</html>
