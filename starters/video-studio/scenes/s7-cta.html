<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call to action</title>
<link rel="stylesheet" href="../lib/stage.css">
<script src="../lib/brand.js"></script>
<script src="../lib/studio.js"></script>
<script src="../lib/logo.js"></script>
<style>
  .lockup { font-size: 7.4vmin; }
  @keyframes lockIn { from { opacity: 0; transform: translateY(2vmin) scale(.94); } to { opacity: 1; transform: none; } }
  .lockup { animation: lockIn .9s cubic-bezier(.16,1,.3,1) .1s; }

  .headline { font-size: var(--t-h2); font-weight: 700; letter-spacing: -.024em; max-width: 100%; line-height: 1.16; }
  .btn { background: linear-gradient(100deg, var(--brand-accent), var(--brand-gold-hi, #f2dda3));
         color: #191510; box-shadow: 0 2vmin 6vmin -1.6vmin var(--brand-accent); }
  @keyframes pulse { from { box-shadow: 0 2vmin 6vmin -1.6vmin var(--brand-accent); }
                     to   { box-shadow: 0 2vmin 11vmin -1vmin var(--brand-accent); } }
  .btn { animation: pulse 1.7s ease-in-out 2.3s infinite alternate; }
  .trust { display: flex; gap: 4vmin; flex-wrap: wrap; justify-content: center; margin-top: 1.4vmin; }
  .trust span { font-size: 2vmin; opacity: .6; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg-glow a-drift"></div>
    <div class="bg-grid a-fade" style="--dur:1.2s"></div>
    <div class="bg-vignette"></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:2.8vmin;width:100%">
      <div class="lockup" data-wordmark></div>
      <div class="headline" id="headline"></div>
      <div class="a-pop" style="--delay:1.5s;--dur:.8s"><div class="btn" id="cta"></div></div>
      <div class="url a-fade" style="--delay:1.9s" id="url"></div>
      <div class="trust a-fade" style="--delay:2.2s" id="trust"></div>
    </div>
  </div>
<script>
window.__sceneReady = (async () => {
  await window.__logoReady;
  const cfg = window.__brand;
  const d = window.__scene || {};
  window.__studio.lines(document.getElementById("headline"), d.lines || [], { delay: .85, stagger: .16 });
  document.getElementById("cta").textContent = d.cta || cfg.brand.cta;
  document.getElementById("url").textContent = d.url || cfg.brand.url;

  const trust = document.getElementById("trust");
  (d.trust || []).forEach((t) => {
    const s = document.createElement("span");
    s.textContent = t;
    trust.appendChild(s);
  });
})();
</script>
</body>
</html>
