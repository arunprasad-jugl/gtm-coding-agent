<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Act IV · The turn</title>
<link rel="stylesheet" href="../lib/stage.css">
<link rel="stylesheet" href="../lib/cinema.css">
<script src="../lib/brand.js"></script>
<script src="../lib/studio.js"></script>
<script src="../lib/cinema.js"></script>
<style>
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 1.4vmin; z-index: 10; width: 100%; }
  .one { font-size: var(--t-h2); font-weight: 600; opacity: .8; }
  .big {
    font-size: 15vmin; font-weight: 800; letter-spacing: -.05em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--brand-accent);
  }
  .cap { font-size: var(--t-h2); font-weight: 600; letter-spacing: -.02em; max-width: 84%; }
  .foot { font-size: 1.85vmin; opacity: .42; margin-top: 2vmin; max-width: 62%; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg-glow a-drift"></div>
    <div class="bg-vignette"></div>
    <div class="grain" id="grain"></div>

    <div class="wrap">
      <div class="one a-rise" style="--delay:.15s">One call. $476.</div>
      <div class="big" id="big">$0</div>
      <div class="cap" id="cap"></div>
      <div class="body foot a-fade" style="--delay:4.2s">Illustrative model for a 120-room extended-stay property. Replace with your own numbers.</div>
    </div>

    <div class="bars static"></div>
  </div>

<script>
window.__sceneReady = (async () => {
  await window.__brandReady;
  window.__cinema.grain(document.getElementById("grain"));
  window.__studio.lines(document.getElementById("cap"), ["recovered every year."], { delay: 2.6 });

  const big = document.getElementById("big");
  window.__studio.onSeek((t) => {
    const n = window.__studio.tween(t, { from: 0, to: 103900, delay: 900, dur: 2400, ease: "outExpo" });
    big.textContent = "$" + Math.round(n).toLocaleString("en-US");
  });
})();
</script>
</body>
</html>
