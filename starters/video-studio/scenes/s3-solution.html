<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solution reveal</title>
<link rel="stylesheet" href="../lib/stage.css">
<script src="../lib/brand.js"></script>
<script src="../lib/studio.js"></script>
<script src="../lib/logo.js"></script>
<style>
  .mark { width: 16vmin; height: 13vmin; filter: drop-shadow(0 0 4vmin color-mix(in srgb, var(--brand-accent) 55%, transparent)); }
  @keyframes markIn { from { opacity: 0; transform: translateY(2.5vmin) scale(.82); } to { opacity: 1; transform: none; } }
  .mark { animation: markIn 1s cubic-bezier(.16,1,.3,1) .1s; }
  /* The bell sounds: rings flick outward just after the dome lands. */
  @keyframes ringOut { from { opacity: 0; transform: translateX(0); } 60% { opacity: 1; } to { opacity: .9; transform: translateX(var(--dx)); } }
  .mark .bell-ring { animation: ringOut .7s cubic-bezier(.16,1,.3,1) .75s; --dx: -2px; }
  .mark .bell-ring.two { --dx: 2px; }

  .name { font-size: 11vmin; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .desc { max-width: 70%; font-size: 2.9vmin; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg-glow a-drift"></div>
    <div class="bg-grid a-fade" style="--dur:1.4s"></div>
    <div class="bg-vignette"></div>

    <div class="a-out" style="display:flex;flex-direction:column;align-items:center;gap:2.6vmin;width:100%">
      <div class="mark" data-logo></div>
      <div class="kicker a-rise" style="--delay:.9s" id="kicker"></div>
      <div class="name" id="name"></div>
      <p class="body desc a-rise" style="--delay:1.8s" id="desc"></p>
    </div>
  </div>
<script>
window.__sceneReady = (async () => {
  await window.__logoReady;
  const d = window.__scene || {};
  document.getElementById("kicker").textContent = d.kicker || "";
  document.getElementById("desc").textContent = d.description || "";
  window.__studio.lines(document.getElementById("name"), [d.name || ""], { delay: 1.15, gradient: true });
})();
</script>
</body>
</html>
